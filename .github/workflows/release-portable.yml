name: Attach current QIF distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  portable-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify release version and build distributions
        shell: bash
        run: |
          test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
          npm test
      - name: Attach portable and Agent Skill packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" \
            "dist/qif-portable-v${VERSION}.zip" \
            "dist/qif-portable-v${VERSION}.zip.sha256" \
            "dist/qif-agent-skill-v${VERSION}.zip" \
            "dist/qif-agent-skill-v${VERSION}.zip.sha256" \
            --clobber
